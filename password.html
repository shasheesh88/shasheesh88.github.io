<!DOCTYPE html>
<html>
<head>
<title>Private Site</title>

<script>
function checkPassword() {

  var correctPassword = "mypassword123";   // CHANGE THIS
  var entered = document.getElementById("pass").value;

  if(entered === correctPassword){
      sessionStorage.setItem("auth", "yes");
      window.location.href = "/";
  } else {
      alert("Wrong password");
  }
}
</script>

</head>

<body style="text-align:center; margin-top:120px; font-family:Arial">

<h2>This site is private</h2>
<p>Enter password to continue</p>

<input type="password" id="pass" placeholder="Password">
<br><br>
<button onclick="checkPassword()">Enter</button>

</body>
</html>
